# ════════════════════════════════════════════════════════════════════════════
# Contribution Snake — GitHub Action
#
# Setup (one time):
#   1. In your profile repo (alimohammedassi/alimohammedassi), create the file:
#        .github/workflows/generate-snake.yml   ← copy this whole file there
#   2. Go to the "Actions" tab → "Generate contribution snake" → "Run workflow"
#   3. Done ✅ — it also re-runs automatically once a day.
#      The snake SVG is pushed to the "output" branch and shows up in your README.
# ════════════════════════════════════════════════════════════════════════════

name: Generate contribution snake

on:
  schedule:
    - cron: "30 0 * * *" # every day at 00:30 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
